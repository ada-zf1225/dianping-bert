name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-groups
      - run: uv run ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-groups
      - run: uv run pytest -q

  smoke:
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-groups

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bert-base-chinese-v1

      - name: Fetch dataset
        run: |
          git clone --depth 1 https://www.modelscope.cn/datasets/DAMO_NLP/yf_dianping.git data/raw
          uv run python -m src.download

      - name: Data stats
        run: uv run python -m src.stats

      - name: TF-IDF baseline
        run: uv run python -m src.baseline_tfidf

      - name: BERT smoke (CPU, 200 samples)
        run: uv run python -m src.train --n_train 200 --epochs 1 --max_len 32 --batch 16 --run ci_smoke

      - name: Regenerate README figures from committed results
        run: |
          uv run python -m src.aggregate
          uv run python -m src.plots
          test -f docs/figs/main_results.png

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-outputs
          path: |
            results/ci_smoke.json
            results/summary.csv
            docs/figs/*.png
